<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KK-Agent · 行情助手</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#2d333b; --text:#e6edf3;
    --muted:#8b949e; --gold:#f0b90b; --gold-dark:#b8890a; --green:#3fb950; --red:#f85149;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--panel)}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-size:15px}
  h1{font-size:17px;font-weight:600}
  .sub{color:var(--muted);font-size:12px}
  .badge{margin-left:auto;font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
  .badge.ok{color:var(--green);border-color:var(--green)}
  main{flex:1;display:flex;min-height:0}
  /* Left: chat */
  #chatPane{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
  #messages{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:82%;padding:10px 14px;border-radius:12px;line-height:1.55;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--gold);color:#000;border-bottom-right-radius:4px;font-weight:500}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
  .msg.bot.warn{border-color:var(--gold-dark)}
  #inputBar{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--border);background:var(--panel)}
  #inputBar input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:14px;outline:none}
  #inputBar input:focus{border-color:var(--gold)}
  #inputBar button{background:var(--gold);border:none;border-radius:8px;padding:0 22px;font-weight:700;color:#000;cursor:pointer;font-size:14px}
  #inputBar button:hover{background:#ffd633}
  #inputBar button:disabled{opacity:.5;cursor:wait}
  /* Right: market panel */
  #side{width:360px;display:flex;flex-direction:column;background:var(--panel)}
  .sideHead{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .sideHead b{color:var(--text)}
  #moversBox{flex:1;overflow-y:auto;padding:8px 0}
  .row{display:flex;align-items:center;padding:8px 16px;gap:10px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer}
  .row:hover{background:rgba(240,185,11,.07)}
  .row .sym{flex:1;font-weight:600}
  .row .px{color:var(--muted);width:90px;text-align:right}
  .row .chg{width:74px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .up{color:var(--green)} .down{color:var(--red)}
  .sectionTitle{padding:10px 16px 4px;font-size:11px;letter-spacing:.08em;color:var(--muted)}
  #status{padding:8px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.6}
  .chips{display:flex;gap:8px;padding:0 18px 10px;flex-wrap:wrap;background:var(--panel)}
  .chip{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--border);color:var(--muted);cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--gold);color:var(--gold)}
  .curCoin{font-size:13px;font-weight:700;color:var(--gold);background:rgba(240,185,11,.12);border:1px solid var(--gold-dark);border-radius:8px;padding:5px 14px;user-select:none;transition:transform .15s}
  .curCoin.flash{transform:scale(1.18)}
  .tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--border)}
  .tab{flex:1;text-align:center;padding:7px 0;font-size:12px;color:var(--muted);cursor:pointer;border-radius:6px 6px 0 0;user-select:none}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--gold);font-weight:600;background:rgba(240,185,11,.08)}
  /* K线区 */
  #klineBox{height:120px;display:flex;align-items:stretch;gap:2px;padding:8px 12px 4px;overflow:hidden}
  .kcandle{flex:1;position:relative;min-width:3px;cursor:pointer}
  .kbar{position:absolute;left:0;width:100%;border-radius:1px}
  .kbar.up{background:var(--green)} .kbar.down{background:var(--red)}
  .kwick{position:absolute;left:50%;width:1px}
  .kwick.up{background:var(--green);opacity:.6} .kwick.down{background:var(--red);opacity:.6}
  #klineTip{position:fixed;background:#000;border:1px solid var(--gold);color:var(--text);font-size:11px;padding:6px 9px;border-radius:6px;pointer-events:none;display:none;z-index:60;line-height:1.6;white-space:nowrap}
  .ktab{flex:1;text-align:center;font-size:11px;padding:4px 0;color:var(--muted);cursor:pointer;border-radius:5px;user-select:none}
  .ktab:hover{color:var(--text)}
  .ktab.on{color:var(--gold);background:rgba(240,185,11,.1);font-weight:600}
  .wchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;margin:3px 4px;border-radius:99px;border:1px solid var(--border);color:var(--text);cursor:pointer;user-select:none}
  .wchip:hover{border-color:var(--gold);color:var(--gold)}
  .wchip b{font-weight:600}
  @media (max-width:900px){#side{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">KK</div>
  <div>
    <h1>KK-Agent</h1>
    <div class="sub">行情 · 技术信号 · 市场报告</div>
  </div>
  <span class="badge" id="stBadge">…</span>
</header>
<main>
  <section id="chatPane">
    <div id="messages"></div>
    <div class="chips">
      <span class="curCoin" id="curCoin" title="当前币种：点击右侧榜单切换">BTC</span>
      <span class="chip" id="btnReport">报告</span>
      <span class="chip" id="btnSignal">信号</span>
      <span class="chip" id="btnConf" title="1h+4h 多周期共振分析">共振</span>
      <span class="chip" id="btnBacktest" title="历史回测：信号策略 vs 买入持有">回测</span>
      <span class="chip" id="btnWatch" title="当前币种加入/移出自选">☆ 自选</span>
      <span class="chip" id="btnPrice">价格</span>
      <span class="chip" data-q="涨跌榜">涨跌榜</span>
      <span class="chip" data-q="挂单">订单</span>
      <span class="chip" id="btnCopy" title="复制上一条报告为 Markdown">复制</span>
      <span class="chip" data-q="你的能力介绍">能力</span>
      <span class="chip" data-q="MCP 怎么配置">MCP</span>
    </div>
    <div id="inputBar">
      <input id="q" placeholder="问行情、要报告、下模拟单…（回车发送）" autocomplete="off">
      <button id="send">发送</button>
    </div>
  </section>
  <aside id="side">
    <div class="sideHead"><b id="klineTitle">BTCUSDT · 1h K线</b><span id="klineChg" class="chg">—</span></div>
    <div id="klineBox"><div class="sectionTitle">加载中…</div></div>
    <div style="display:flex;gap:2px;padding:0 12px 6px">
      <span class="ktab on" data-iv="15m">15m</span>
      <span class="ktab" data-iv="1h">1h</span>
      <span class="ktab" data-iv="4h">4h</span>
      <span class="ktab" data-iv="1d">1d</span>
    </div>
    <div class="sideHead" style="border-top:1px solid var(--border)"><b>自选列表</b><span>点击币种选中</span></div>
    <div id="watchBox" style="min-height:34px;padding:4px 0"></div>
    <div class="sideHead"><b>24h 市场榜</b><span>USDT 交易对</span></div>
    <div class="tabs">
      <span class="tab on" data-tab="movers">涨跌</span>
      <span class="tab" data-tab="volume">热度</span>
      <span class="tab" data-tab="amplitude">振幅</span>
      <span class="tab" data-tab="scan">信号</span>
    </div>
    <div id="moversBox"><div class="sectionTitle">加载中…</div></div>
    <div id="status"></div>
    <div style="padding:10px 16px;border-top:1px solid var(--border)">
      <span class="chip" id="btnKeys">⚙ Key 设置</span>
    </div>
  </aside>
</main>
<!-- Key 设置弹窗 -->
<div id="modalMask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center">
  <div style="width:440px;max-width:92vw;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 24px;max-height:88vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <b style="font-size:15px">设置</b>
      <span class="chip" id="mClose" style="padding:3px 10px">✕</span>
    </div>
    <div id="mState" style="font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:14px"></div>

    <div style="font-size:13px;font-weight:600;margin:10px 0 6px">交易环境</div>
    <select id="mEnv" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;outline:none">
      <option value="testnet">模拟盘 testnet</option>
      <option value="mainnet">正式盘</option>
    </select>

    <div style="font-size:13px;font-weight:600;margin:12px 0 6px">币安 API Key / Secret</div>
    <input id="mKey" type="password" placeholder="留空 = 保持现有 Key 不变" autocomplete="off"
      style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;margin-bottom:8px">
    <input id="mSecret" type="password" placeholder="留空 = 保持现有 Secret 不变" autocomplete="off"
      style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;outline:none">

    <div style="font-size:13px;font-weight:600;margin:12px 0 6px">单笔下单限额（USDT）</div>
    <input id="mLimit" type="number" min="1" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;outline:none">

    <label style="display:flex;align-items:center;gap:8px;margin:12px 0;font-size:13px;cursor:pointer">
      <input id="mTrading" type="checkbox" style="width:15px;height:15px;accent-color:var(--gold)">
      允许下单（关闭 = 只查询不下单）
    </label>

    <label style="display:flex;align-items:center;gap:8px;margin:4px 0 4px;font-size:13px;cursor:pointer">
      <input id="mVerify" type="checkbox" checked style="width:15px;height:15px;accent-color:var(--gold)">
      保存前先验证 Key 是否有效（推荐）
    </label>

    <label style="display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:13px">LLM 提供商
      <select id="mProv" style="flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;outline:none">
        <option value="">不更改</option>
        <option value="mock">mock（规则引擎）</option>
        <option value="deepseek">DeepSeek</option>
        <option value="openai">OpenAI</option>
        <option value="glm">GLM</option>
        <option value="moonshot">Moonshot</option>
        <option value="qwen">Qwen</option>
        <option value="anthropic">Anthropic</option>
      </select>
    </label>
    <input id="mLlmKey" type="password" placeholder="LLM API Key（留空 = 不变）" autocomplete="off"
      style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;margin-bottom:8px">
    <input id="mLlmModel" type="text" placeholder="模型名（留空 = 默认，如 deepseek-chat）" autocomplete="off"
      style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;outline:none">

    <div style="display:flex;gap:10px;margin-top:16px">
      <button id="mSave" style="flex:1;background:var(--gold);border:none;border-radius:8px;padding:11px;font-weight:700;color:#000;cursor:pointer">验证并保存</button>
    </div>
    <div id="mMsg" style="margin-top:10px;font-size:12px;line-height:1.6;color:var(--muted);white-space:pre-wrap"></div>
    <div style="margin-top:10px;font-size:11px;color:var(--muted);line-height:1.6">
      安全说明：Key 只保存在本机 .env 文件，绝不上传；测试网 Key 在 testnet.binance.vision 免费注册；
      正式盘请用子账户且绝不开提币权限。
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
let AUTH="";
(async()=>{try{AUTH=(await(await fetch("/api/auth")).json()).token;}catch(e){}})();
function post(url,data){
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json","x-bn-token":AUTH},body:JSON.stringify(data)});
}
const box=$("#messages");
function add(cls,text){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight;return d;}
async function sendQ(q){
  if(!q||q.trim()==="")return;
  add("user",q);$("#q").value="";
  const think=add("bot","思考中…");
  $("#send").disabled=true;
  try{
    const r=await post("/api/chat",{message:q});
    const j=await r.json();
    think.textContent=j.reply||("错误: "+(j.detail||r.status));
    if((j.reply||"").includes("风险")||j.reply.includes("⚠"))think.classList.add("warn");
  }catch(e){think.textContent="请求失败: "+e.message;}
  $("#send").disabled=false;$("#q").focus();
}
$("#send").onclick=()=>sendQ($("#q").value);
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")sendQ($("#q").value);});
document.querySelectorAll(".chip[data-q]").forEach(c=>c.onclick=()=>sendQ(c.dataset.q));
let curCoin="BTC", curIv="1h";
const tip=document.createElement("div");tip.id="klineTip";document.body.appendChild(tip);
async function loadKline(){
  const box=$("#klineBox");
  try{
    const j=await(await fetch("/api/kline/"+curCoin+"USDT?interval="+curIv+"&limit=48")).json();
    const cs=j.candles||[];
    if(!cs.length){box.innerHTML='<div class="sectionTitle">无数据</div>';return;}
    $("#klineTitle").textContent=curCoin+"USDT · "+curIv+" K线";
    const first=cs[0].c,last=cs[cs.length-1].c,chg=(last-first)/first*100;
    const cel=$("#klineChg");
    cel.textContent=(chg>=0?"+":"")+chg.toFixed(2)+"%";
    cel.className="chg "+(chg>=0?"up":"down");
    const hi=Math.max(...cs.map(x=>x.h)),lo=Math.min(...cs.map(x=>x.l)),rng=(hi-lo)||1;
    // 正确坐标：价格越高，top 越小（顶部=最高价）
    let html="";
    for(const k of cs){
      const up=k.c>=k.o;
      const bodyTopPct=(hi-Math.max(k.o,k.c))/rng*100;          // 实体上沿距顶端
      const bodyHPct=Math.max(Math.abs(k.c-k.o)/rng*100,0.8);   // 实体高度
      const wickTopPct=(hi-k.h)/rng*100;                        // 影线顶端
      const wickHPct=Math.max((k.h-k.l)/rng*100,0.5);           // 影线长度
      html+='<div class="kcandle" data-o="'+k.o+'" data-h="'+k.h+'" data-l="'+k.l+'" data-c="'+k.c+'" data-v="'+k.v+'" data-t="'+k.t+'">'
        +'<div class="kwick '+(up?"up":"down")+'" style="top:'+wickTopPct+'%;height:'+wickHPct+'%"></div>'
        +'<div class="kbar '+(up?"up":"down")+'" style="top:'+bodyTopPct+'%;height:'+bodyHPct+'%"></div>'
        +'</div>';
    }
    box.innerHTML=html;
  }catch(e){box.innerHTML='<div class="sectionTitle">K线加载失败</div>';}
}
document.querySelectorAll(".ktab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".ktab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");curIv=t.dataset.iv;loadKline();
});
box_kline_click_init=false;
document.getElementById("klineBox").addEventListener("mousemove",e=>{
  const c=e.target.closest(".kcandle");
  if(!c){tip.style.display="none";return;}
  const t=new Date(+c.dataset.t).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit"});
  tip.innerHTML="<b>"+curCoin+"USDT</b> "+t+"<br>开 "+(+c.dataset.o).toPrecision(6)+"<br>高 "+(+c.dataset.h).toPrecision(6)+"<br>低 "+(+c.dataset.l).toPrecision(6)+"<br>收 "+(+c.dataset.c).toPrecision(6);
  tip.style.display="block";
  tip.style.left=Math.min(e.clientX+12,innerWidth-160)+"px";
  tip.style.top=(e.clientY+12)+"px";
});
document.getElementById("klineBox").addEventListener("mouseleave",()=>{tip.style.display="none";});
document.getElementById("klineBox").addEventListener("click",e=>{
  const c=e.target.closest(".kcandle");
  if(c)sendQ(curCoin+"USDT 行情报告");
});
function setCoin(sym){
  // MUBARAKUSDT -> MUBARAK；兼容 USDC 等后缀
  curCoin=sym.replace(/(USDT|USDC|FDUSD)$/,"")||sym;
  const el=$("#curCoin");
  el.textContent=curCoin;
  el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");
  loadKline();   // 联动：切币种刷新K线
  if($("#btnWatch"))$("#btnWatch").textContent=watchList.includes(curCoin+"USDT")?"★ 自选":"☆ 自选";
}
$("#btnReport").onclick=()=>sendQ(curCoin+" 行情报告");
$("#btnSignal").onclick=()=>sendQ(curCoin+" 信号分析");
$("#btnPrice").onclick=()=>sendQ(curCoin+" 现在多少钱");
$("#btnConf").onclick=()=>sendQ(curCoin+" 共振信号");
$("#btnBacktest").onclick=()=>sendQ(curCoin+" 回测 "+curIv);
let watchList=[];
async function loadWatch(){
  try{
    const r=await(await post("/api/watch",{action:"list"})).json();
    const lines=(r.reply||"").split("\n").slice(1).filter(l=>l.trim());
    watchList=lines.map(l=>l.trim().split(/\s+/)[0]);
    const box=$("#watchBox");
    box.innerHTML=lines.map(l=>{
      const sym=l.trim().split(/\s+/)[0], base=sym.replace(/USDT$/,"");
      const pct=l.match(/([+-][\d.]+)%/);
      const cls=pct?(pct[1].startsWith("+")?"up":"down"):"";
      return '<span class="wchip" data-sym="'+base+'">'+base+' <b class="'+cls+'">'+(pct?pct[1]+"%":"")+'</b></span>';
    }).join("")||'<span class="sectionTitle" style="padding:4px 12px">暂无自选，点 ☆ 添加</span>';
    if($("#btnWatch"))$("#btnWatch").textContent=watchList.includes(curCoin+"USDT")?"★ 自选":"☆ 自选";
  }catch(e){}
}
$("#btnWatch").onclick=async()=>{
  const inList=watchList.includes(curCoin+"USDT");
  await(await post("/api/watch",{action:inList?"del":"add",symbol:curCoin+"USDT"})).json();
  await loadWatch();
};
document.getElementById("watchBox").addEventListener("click",e=>{
  const w=e.target.closest(".wchip");
  if(w)setCoin(w.dataset.sym);
});
// 报告一键复制（取最近一条 bot 消息）
let lastBotText="";
const _add=add;
add=function(cls,text){if(cls==="bot")lastBotText=text;return _add(cls,text);};
$("#btnCopy").onclick=async()=>{
  if(!lastBotText){return;}
  try{await navigator.clipboard.writeText(lastBotText);$("#btnCopy").textContent="已复制";setTimeout(()=>$("#btnCopy").textContent="复制",1500);}
  catch(e){$("#btnCopy").textContent="复制失败";}
};
async function loadStatus(){
  try{const j=await(await fetch("/api/status")).json();
    const b=$("#stBadge");
    b.textContent=j.llm.includes("no key")?"规则引擎模式":"LLM 已接入";
    b.className="badge"+(j.llm.includes("no key")?"":" ok");
    $("#status").innerHTML=j.risk.replace(/\n/g,"<br>")+"<br>Web 端交易: "+j.web_trading;
  }catch(e){$("#stBadge").textContent="离线";}
}
let curTab="movers";
function fmtVol(v){
  if(v>=1e9)return (v/1e9).toFixed(2)+"B";
  if(v>=1e6)return (v/1e6).toFixed(1)+"M";
  if(v>=1e3)return (v/1e3).toFixed(1)+"K";
  return String(Math.round(v));
}
const stCN={golden_cross:"金叉",death_cross:"死叉",bullish:"偏多",bearish:"偏空",neutral:"中性",oversold:"超卖",overbought:"超买",breakout_up:"破上轨",breakout_down:"破下轨"};
function rowHtml(r,cols){
  let h='<div class="row" data-sym="'+r.symbol+'">';
  for(const c of cols){
    if(c==="chg")h+='<span class="chg '+(r.change_pct>=0?"up":"down")+'" style="width:64px;text-align:left">'+(r.change_pct>=0?"+":"")+r.change_pct.toFixed(2)+'%</span>';

    if(c==="price")h+='<span class="px">'+r.price+'</span>';
    if(c==="vol")h+='<span class="px">'+fmtVol(r.quote_volume)+'</span>';
    if(c==="amp")h+='<span class="px" style="width:64px">'+r.amplitude_pct.toFixed(2)+'%</span>';
    if(c==="sig")h+='<span class="chg '+(r.score>=1?"up":(r.score<=-1?"down":""))+'" style="width:96px;text-align:right">'+(stCN[r.macd_state]||stCN[r.ma_state]||"中性")+' / '+stCN[r.rsi_state]+'</span>';
  }
  return h+'</div>';
}

// ---------- 信号推送：本地轮询自选币的 MACD 金叉/死叉，弹提示（纯本地，无服务器） ----------
const notified={};
function toast(title,body){
  const t=document.createElement("div");
  t.style.cssText="position:fixed;top:60px;right:16px;z-index:70;background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:13px;max-width:300px;line-height:1.6;box-shadow:0 4px 18px rgba(0,0,0,.5)";
  t.innerHTML="<b style='color:var(--gold)'>"+title+"</b><br>"+body;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),12000);
  t.onclick=()=>{t.remove();sendQ(title.split(" ")[0]+"USDT 行情报告");};
}
async function pollSignals(){
  for(const sym of watchList){
    const key=sym+":"+curIv;
    try{
      const c=await(await fetch("/api/kline/"+sym+"?interval="+curIv+"&limit=40")).json();
      const cs=c.candles||[];
      if(cs.length<30)continue;
      // 快速 MACD 状态：diff 最后两根
      const closes=cs.map(x=>x.c);
      const ema=(arr,p)=>{const k=2/(p+1);let e=arr[0];return arr.map(x=>(e=x*k+e*(1-k)));};
      const dif=ema(closes,12).map((x,i)=>x-ema(closes,26)[i]);
      const dea=ema(dif,9);
      const h1=dif[dif.length-1]-dea[dea.length-1], h0=dif[dif.length-2]-dea[dea.length-2];
      const cur=h1>0?"golden":"death", prev=h0>0?"golden":"death";
      if(cur!==prev&&!notified[key+cur]){
        notified[key+cur]=true;
        const cross=cur==="golden"?"金叉（动能转强）":"死叉（动能转弱）";
        const up=cur==="golden";
        toast(sym.replace("USDT","")+" "+curIv+" MACD "+(up?"▲":"▼"), cross+"<br>点击查看该币行情报告");
      }
    }catch(e){}
  }
}
setInterval(pollSignals,300000);   // 每 5 分钟扫一轮自选

      msg.textContent="验证 Key 有效性…";
      const v=await(await post("/api/keys/verify",body)).json();

      msg.textContent="Key 验证通过，正在保存…";

  btn.disabled=false;
};
